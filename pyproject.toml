# The standalone SHHV & Switch application as an installable package: Transport_RT.py
# plus the transport package beside it.  `pip install transport_rt-<version>-py3-none-any.whl`
# adds the `transport-rt` command; `python Transport_RT.py` in a copied
# folder works too.  The version is APP_VERSION of tools/rt_host.py.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-rt"
version = "1.0"
description = "Room-temperature harmonic Hall (SHHV) and current-pulse switching measurement control program (Tk GUI): the SHHV & Switch page of Transport-all as a program of its own"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# As on the development Mac and in CI.  Instrument libraries that need a
# vendor install (see requirements.txt)
# are added on the lab PC (requirements.txt).
dependencies = ["numpy", "pillow", "pyvisa", "pyserial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/nbb2026/Transport-all/tree/Transport-RT"

[project.scripts]
transport-rt = "transport.rt.app:run"

[tool.setuptools]
py-modules = ["Transport_RT"]
packages = [
    "transport",
    "transport.common",
    "transport.core",
    "transport.rt",
    "transport.ppms",
]
