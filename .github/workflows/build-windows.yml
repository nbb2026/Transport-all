# Builds Transport_all.exe: the whole program as one Windows file (Windows
# 10/11, 64-bit) that runs without Python or any package installed.  Runs on
# every push to main (and to ci/** test branches), or by hand: Actions tab ->
# "Windows exe" -> Run workflow.  The .exe is attached to the run as the
# artifact "Transport_all-windows-x64" (open the run, then Artifacts).  A build
# of main also replaces the .exe of the pre-release "Windows exe (newest main)"
# (tag windows-exe, made once by the owner; this workflow never moves the tag),
# so it can be downloaded directly, without signing in, from the Releases page.
#
# Before uploading, the .exe is checked on the runner: it loads every library
# it bundles (--package-self-test), loads the PCO DLLs (--pco-dll-self-test),
# and starts and shows its main window.  No instrument is attached here, so
# instrument control itself is not tested.
name: Windows exe

on:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  RELEASE_TAG: windows-exe

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    # A newer push to the same branch replaces a build still running.
    concurrency:
      group: windows-exe-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Screen like the lab PC
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 2560 -Height 1440 -Force
      - name: Python packages (requirements.txt) and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10
          python -m pip check
      - name: Build Transport_all.exe
        run: python -m PyInstaller --noconfirm --clean Other-files/packaging/Transport_all.spec
      - name: Build information
        shell: pwsh
        run: |
          $exe = Get-Item dist/Transport_all.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # A plain \n line end, so `shasum -a 256 -c` also reads it on a Mac.
          Set-Content -NoNewline -Encoding ascii dist/Transport_all.exe.sha256 -Value "$hash  Transport_all.exe`n"
          $version = (Select-String -Path Transport_all.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          # The version information set in the spec (publisher: user, 2026-11-12).
          $vi = $exe.VersionInfo
          $vi | Format-List CompanyName, FileDescription, ProductName, FileVersion, ProductVersion, OriginalFilename
          if ($vi.CompanyName -ne "HengNiu & ClaudeCode") { throw "Publisher (CompanyName) is '$($vi.CompanyName)'" }
          if ($vi.ProductVersion -ne $version) { throw "ProductVersion '$($vi.ProductVersion)' is not $version" }
          $info = @(
            "Transport_all.exe, program version $version",
            "Publisher: $($vi.CompanyName) (company name in the file's version information; not code-signed)",
            "Commit: $env:GITHUB_SHA ($env:GITHUB_REF_NAME)",
            "Built: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC, run $env:GITHUB_RUN_ID",
            "Size: $($exe.Length) bytes",
            "SHA-256: $hash",
            "",
            "Python $(python -c 'import platform; print(platform.python_version())') and packages:"
          ) + (python -m pip freeze)
          $info | Set-Content -Encoding utf8 dist/BUILD_INFO.txt
          Get-Content dist/BUILD_INFO.txt | Select-Object -First 7
      - name: The .exe loads every library it bundles
        shell: pwsh
        run: |
          $p = Start-Process (Resolve-Path dist/Transport_all.exe).Path -ArgumentList "--package-self-test" -Wait -PassThru
          Get-Content dist/Transport_all_package_self_test.txt
          if ($p.ExitCode -ne 0) { throw "Package self-test failed (exit code $($p.ExitCode))" }
      - name: The program's own PCO DLL self-test
        if: success() || failure()
        shell: pwsh
        run: |
          $p = Start-Process (Resolve-Path dist/Transport_all.exe).Path -ArgumentList "--pco-dll-self-test" -Wait -PassThru
          Get-Content dist/MOKE_NH_*_pco_self_test.txt
          if ($p.ExitCode -ne 0) { throw "PCO DLL self-test failed (exit code $($p.ExitCode))" }
      - name: The program starts and shows its window
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exe-check | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("exe-check/$name.png")
          }
          $title = "Magneto_Electro_Optical_Microwave_Transport_NH"
          $started = Get-Date
          $p = Start-Process (Resolve-Path dist/Transport_all.exe).Path -PassThru
          $window = $null
          while (-not $window -and ((Get-Date) - $started).TotalSeconds -lt 180) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Save-Screen "exited"; throw "Transport_all.exe exited during start-up (exit code $($p.ExitCode))" }
            $window = Get-Process Transport_all -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -like "$title*" } | Select-Object -First 1
          }
          if (-not $window) {
            Save-Screen "no_window"
            Get-Process Transport_all -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle | Out-String | Write-Host
            throw "No main window within 180 s"
          }
          "Main window '$($window.MainWindowTitle)' after $([int]((Get-Date) - $started).TotalSeconds) s"
          Start-Sleep -Seconds 15
          Save-Screen "started"
          if ($p.HasExited) { throw "Transport_all.exe exited after its window appeared (exit code $($p.ExitCode))" }
          Get-Process Transport_all | Format-Table Id, MainWindowTitle | Out-String | Write-Host
          Stop-Process -Name Transport_all -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Transport_all-windows-x64
          path: |
            dist/Transport_all.exe
            dist/Transport_all.exe.sha256
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: exe-checks
          path: |
            exe-check
            dist/*_self_test.txt
            build/Transport_all/warn-Transport_all.txt
          if-no-files-found: ignore

  # Only a build of main that passed every check above gets here.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One at a time and never cut off half-way, so the newest build is last.
    concurrency:
      group: windows-exe-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Transport_all-windows-x64
          path: dist
      - name: Replace the .exe in the release "Windows exe (newest main)"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha256=$(cut -d' ' -f1 dist/Transport_all.exe.sha256)
          version=$(sed -n 's/^Transport_all.exe, program version //p' dist/BUILD_INFO.txt | tr -d '\r')
          publisher=$(sed -n 's/^Publisher: \(.*\) (company name.*/\1/p' dist/BUILD_INFO.txt | tr -d '\r')
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          cat > notes.md <<EOF
          \`Transport_all.exe\`: the whole program for Windows 10/11 (64-bit), no Python needed. It is
          rebuilt from the newest \`main\` and replaced here after every push that passes its checks.

          - Commit: [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), program version $version
          - Publisher: $publisher (in the file's properties; the .exe is not code-signed)
          - Built: $(date -u '+%Y-%m-%d %H:%M') UTC, [run $GITHUB_RUN_ID]($RUN_URL)
          - SHA-256: \`$sha256\`

          Put it in a folder you keep (the results folders are made beside it) and double-click it.
          Instrument drivers are still needed; see the README's "Windows .exe" section.

          The "Source code" files below are GitHub's snapshot of the tag \`$RELEASE_TAG\`
          (commit ${tag_commit:0:7}), which does not move; the .exe is from the commit above.
          EOF
          gh release upload "$RELEASE_TAG" dist/Transport_all.exe dist/Transport_all.exe.sha256 dist/BUILD_INFO.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
