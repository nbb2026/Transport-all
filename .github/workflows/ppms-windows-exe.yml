# Builds Transport_PPMS.exe: the standalone PPMS application (Transport_PPMS.py
# and the transport package) as one Windows file (Windows 10/11, 64-bit) that
# runs without Python or any package installed.  Runs on every push to the
# branch Transport-PPMS (and to ci/** test branches cut from it), or by hand:
# Actions tab -> "PPMS Windows exe" -> Run workflow.  The .exe is attached to
# the run as the artifact "Transport_PPMS-windows-x64".  A build of
# Transport-PPMS also puts its files in the release "Transport_PPMS v<version>"
# (tag ppms-v<version>; the version is APP_VERSION of tools/ppms_host.py), so they
# can be downloaded directly, without signing in: a release that is there
# gets the new files, and a raised version starts a new release on the tag
# the owner pushed for it (the repository lets only its owner make tags).
# The same commit is also built as one folder (Transport_PPMS\Transport_PPMS.exe
# with its libraries in _internal), released beside it as
# Transport_PPMS-folder.zip: it starts faster, as nothing is unpacked on start.
#
# Before uploading, both are checked on the runner: each loads every library
# it bundles and the transport package (--package-self-test), and starts and
# shows its main window.  No instrument is attached here, so instrument
# control itself is not tested.
name: PPMS Windows exe

on:
  push:
    branches: [Transport-PPMS, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  RELEASE_TAG_PREFIX: ppms-v

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    # A newer push to the same branch replaces a build still running.
    concurrency:
      group: ppms-windows-exe-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Screen like the lab PC
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 2560 -Height 1440 -Force
      - name: Python packages (requirements.txt) and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10
          python -m pip check
      - name: Build Transport_PPMS.exe
        run: python -m PyInstaller --noconfirm --clean Other-files/packaging/Transport_PPMS.spec
      - name: Build the one-folder Transport_PPMS
        env:
          TRANSPORT_ONE_FOLDER: "1"
        run: python -m PyInstaller --noconfirm --distpath dist-folder --workpath build-folder Other-files/packaging/Transport_PPMS.spec
      - name: Build information
        shell: pwsh
        run: |
          $exe = Get-Item dist/Transport_PPMS.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # A plain \n line end, so `shasum -a 256 -c` also reads it on a Mac.
          Set-Content -NoNewline -Encoding ascii dist/Transport_PPMS.exe.sha256 -Value "$hash  Transport_PPMS.exe`n"
          $version = (Select-String -Path transport/ppms/app.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          # The version information set in the spec (publisher: user, 2026-11-12).
          $vi = $exe.VersionInfo
          $vi | Format-List CompanyName, LegalCopyright, FileDescription, ProductName, FileVersion, ProductVersion, OriginalFilename
          if ($vi.CompanyName -ne "HengNiu & ClaudeCode") { throw "Publisher (CompanyName) is '$($vi.CompanyName)'" }
          # Copyright (user, 2026-11-12); [char]0xA9 is the copyright sign.
          if ($vi.LegalCopyright -ne "$([char]0xA9) 2026 HengNiu & ClaudeCode") { throw "Copyright is '$($vi.LegalCopyright)'" }
          if ($vi.ProductVersion -ne $version) { throw "ProductVersion '$($vi.ProductVersion)' is not $version" }
          $info = @(
            "Transport_PPMS.exe, program version $version",
            "Publisher: $($vi.CompanyName) (company name in the file's version information; not code-signed)",
            "Copyright: $($vi.LegalCopyright)",
            "Commit: $env:GITHUB_SHA ($env:GITHUB_REF_NAME)",
            "Built: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')) UTC, run $env:GITHUB_RUN_ID",
            "Size: $($exe.Length) bytes",
            "SHA-256: $hash",
            "",
            "Python $(python -c 'import platform; print(platform.python_version())') and packages:"
          ) + (python -m pip freeze)
          # The one-folder build, zipped before any check writes into its folder.
          $folderExe = Get-Item dist-folder/Transport_PPMS/Transport_PPMS.exe
          if ($folderExe.VersionInfo.CompanyName -ne $vi.CompanyName -or $folderExe.VersionInfo.ProductVersion -ne $version) { throw "The one-folder .exe has other version information" }
          Compress-Archive -Path dist-folder/Transport_PPMS -DestinationPath dist/Transport_PPMS-folder.zip -CompressionLevel Optimal
          $zip = Get-Item dist/Transport_PPMS-folder.zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii dist/Transport_PPMS-folder.zip.sha256 -Value "$zipHash  Transport_PPMS-folder.zip`n"
          $info = $info[0..6] + @("One folder: Transport_PPMS-folder.zip, $($zip.Length) bytes, SHA-256: $zipHash") + $info[7..($info.Count - 1)]
          $info | Set-Content -Encoding utf8 dist/BUILD_INFO.txt
          Get-Content dist/BUILD_INFO.txt | Select-Object -First 9
      - name: The .exe loads every library it bundles
        shell: pwsh
        run: |
          foreach ($folder in "dist", "dist-folder/Transport_PPMS") {
            $p = Start-Process (Resolve-Path "$folder/Transport_PPMS.exe").Path -ArgumentList "--package-self-test" -Wait -PassThru
            Get-Content "$folder/Transport_PPMS_package_self_test.txt"
            if ($p.ExitCode -ne 0) { throw "Package self-test of $folder/Transport_PPMS.exe failed (exit code $($p.ExitCode))" }
          }
      - name: The program starts and shows its window
        if: success() || failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exe-check | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("exe-check/$name.png")
          }
          $title = "Transport_PPMS_NH"
          foreach ($build in @(@{ name = "one-file"; exe = "dist/Transport_PPMS.exe" }, @{ name = "one-folder"; exe = "dist-folder/Transport_PPMS/Transport_PPMS.exe" })) {
            $started = Get-Date
            $p = Start-Process (Resolve-Path $build.exe).Path -PassThru
            $window = $null
            while (-not $window -and ((Get-Date) - $started).TotalSeconds -lt 180) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { Save-Screen "$($build.name)_exited"; throw "The $($build.name) Transport_PPMS.exe exited during start-up (exit code $($p.ExitCode))" }
              $window = Get-Process Transport_PPMS -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -like "$title*" } | Select-Object -First 1
            }
            if (-not $window) {
              Save-Screen "$($build.name)_no_window"
              Get-Process Transport_PPMS -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle | Out-String | Write-Host
              throw "No main window of the $($build.name) build within 180 s"
            }
            "$($build.name): main window '$($window.MainWindowTitle)' after $([math]::Round(((Get-Date) - $started).TotalSeconds, 1)) s"
            Start-Sleep -Seconds 15
            Save-Screen "$($build.name)_started"
            if ($p.HasExited) { throw "The $($build.name) Transport_PPMS.exe exited after its window appeared (exit code $($p.ExitCode))" }
            Get-Process Transport_PPMS | Format-Table Id, MainWindowTitle | Out-String | Write-Host
            Stop-Process -Name Transport_PPMS -Force
            Start-Sleep -Seconds 3
          }
      - name: The lab computer's updater goes with the release
        run: Copy-Item Update_Transport_PPMS.bat dist/Update_Transport_PPMS.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Transport_PPMS-windows-x64
          path: |
            dist/Update_Transport_PPMS.bat
            dist/Transport_PPMS.exe
            dist/Transport_PPMS.exe.sha256
            dist/Transport_PPMS-folder.zip
            dist/Transport_PPMS-folder.zip.sha256
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: exe-checks
          path: |
            exe-check
            dist/*_self_test.txt
            dist-folder/Transport_PPMS/*_self_test.txt
            build/Transport_PPMS/warn-Transport_PPMS.txt
          if-no-files-found: ignore

  # Only a build of Transport-PPMS that passed every check above gets here.
  release:
    needs: build
    if: github.ref == 'refs/heads/Transport-PPMS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One at a time and never cut off half-way, so the newest build is last.
    concurrency:
      group: ppms-windows-exe-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Transport_PPMS-windows-x64
          path: dist
      - name: Put the files in the release "Transport_PPMS v<version>"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha256=$(cut -d' ' -f1 dist/Transport_PPMS.exe.sha256)
          zip_sha256=$(cut -d' ' -f1 dist/Transport_PPMS-folder.zip.sha256)
          version=$(sed -n 's/^Transport_PPMS.exe, program version //p' dist/BUILD_INFO.txt | tr -d '\r')
          publisher=$(sed -n 's/^Publisher: \(.*\) (company name.*/\1/p' dist/BUILD_INFO.txt | tr -d '\r')
          if [ -z "$version" ]; then echo "No program version in BUILD_INFO.txt"; exit 1; fi
          RELEASE_TAG="$RELEASE_TAG_PREFIX$version"
          title="Transport_PPMS v$version"
          # A version without a release yet: a new release on its tag.  Only the owner can make tags in
          # this repository, so the tag is not made here.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            if ! gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes "$title" --latest=false --repo "$GITHUB_REPOSITORY"; then
              echo "::error::No release $RELEASE_TAG. Only the owner can make tags in this repository: push the tag (git push origin $GITHUB_SHA:refs/tags/$RELEASE_TAG), then re-run this job."
              exit 1
            fi
          fi
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          cat > notes.md <<EOF
          \`Transport_PPMS.exe\`: the PPMS page of Transport-all as a program of its own, for Windows 10/11
          (64-bit), no Python needed and no Transport_all needed. Version $version: it is rebuilt from the
          \`Transport-PPMS\` branch and replaced here after every push that passes its checks, until
          the version number is raised, which starts a new release.

          - Commit: [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), program version $version
          - Publisher: $publisher (in the file's properties; the .exe is not code-signed)
          - Built: $(date -u '+%Y-%m-%d %H:%M') UTC, [run $GITHUB_RUN_ID]($RUN_URL)
          - SHA-256: \`$sha256\`

          Put it in a folder you keep (the results folders are made beside it) and double-click it.
          Instrument drivers are still needed (NI-VISA and GPIB, LabOne, MultiVu / QDInstrument); see
          the branch's README.

          \`Transport_PPMS-folder.zip\`: the same program as one folder, which starts faster (nothing is
          unpacked on each start). Unzip it to a folder you keep and double-click
          \`Transport_PPMS\\Transport_PPMS.exe\` inside; keep the \`_internal\` folder beside it.
          SHA-256 of the zip: \`$zip_sha256\`

          \`Update_Transport_PPMS.bat\`: for the computer the program is used on. Put it in the folder the
          .exe is kept in and double-click it: it downloads the newest \`Transport_PPMS.exe\` into that folder
          (checked against its SHA-256; never while the program is running; the old one is kept as
          \`Transport_PPMS_previous.exe\`).

          The "Source code" files below are GitHub's snapshot of the tag \`$RELEASE_TAG\`
          (commit ${tag_commit:0:7}), which does not move; the .exe is from the commit above.
          EOF
          gh release upload "$RELEASE_TAG" dist/Transport_PPMS.exe dist/Transport_PPMS.exe.sha256 \
            dist/Transport_PPMS-folder.zip dist/Transport_PPMS-folder.zip.sha256 dist/BUILD_INFO.txt \
            dist/Update_Transport_PPMS.bat --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --title "$title" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
